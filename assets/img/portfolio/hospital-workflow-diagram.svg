<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Hospital Outpatient Workflow</title>
  <desc id="desc">Five workflow stages: patient registration, clinical assessment, diagnostic services when ordered, pharmacy and billing, and visit completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#15304b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L8,5 L0,10 z" fill="#5f7f9e"/>
    </marker>
    <style>
      .heading{font:700 30px Arial,Helvetica,sans-serif;fill:#10243a}
      .sub{font:400 16px Arial,Helvetica,sans-serif;fill:#526a80}
      .stepTitle{font:700 19px Arial,Helvetica,sans-serif;fill:#10243a}
      .body{font:400 15px Arial,Helvetica,sans-serif;fill:#425b72}
      .number{font:700 16px Arial,Helvetica,sans-serif;fill:#fff}
      .footer{font:400 14px Arial,Helvetica,sans-serif;fill:#647b90}
    </style>
  </defs>
  <rect width="1400" height="600" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" class="heading">Illustrative Hospital Outpatient Workflow</text>
  <text x="56" y="94" class="sub">A high-level example for EMR/HIS workflow discussion and implementation planning</text>

  <!-- connectors behind cards -->
  <path d="M267 292 H300" stroke="#5f7f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 292 H563" stroke="#5f7f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M793 292 H826" stroke="#5f7f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1056 292 H1089" stroke="#5f7f9e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="42" y="160" width="225" height="266" rx="18" fill="#ffffff" stroke="#d7e5f0"/>
    <rect x="42" y="160" width="225" height="9" rx="5" fill="#1387c9"/>
  </g>
  <circle cx="75" cy="207" r="19" fill="#1387c9"/><text x="75" y="213" text-anchor="middle" class="number">1</text>
  <g stroke="#1387c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="185" y="189" width="42" height="35" rx="4"/><path d="M194 198h24M194 207h18M194 216h14"/><circle cx="172" cy="196" r="8"/><path d="M159 220c2-11 24-11 26 0"/>
  </g>
  <text x="60" y="264" class="stepTitle">Patient</text><text x="60" y="288" class="stepTitle">Registration</text>
  <text x="60" y="326" class="body"><tspan x="60" dy="0">• Patient identity</tspan><tspan x="60" dy="23">• Visit / appointment</tspan><tspan x="60" dy="23">• Payer information</tspan></text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="305" y="160" width="225" height="266" rx="18" fill="#ffffff" stroke="#d7e5f0"/>
    <rect x="305" y="160" width="225" height="9" rx="5" fill="#16a085"/>
  </g>
  <circle cx="338" cy="207" r="19" fill="#16a085"/><text x="338" y="213" text-anchor="middle" class="number">2</text>
  <g stroke="#16a085" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="445" y="185" width="45" height="39" rx="5"/><path d="M467 194v21M456 204h22"/><path d="M438 226h59"/>
  </g>
  <text x="323" y="264" class="stepTitle">Clinical</text><text x="323" y="288" class="stepTitle">Assessment</text>
  <text x="323" y="326" class="body"><tspan x="323" dy="0">• Triage / initial review</tspan><tspan x="323" dy="23">• Doctor assessment</tspan><tspan x="323" dy="23">• Clinical documentation</tspan></text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="568" y="160" width="225" height="266" rx="18" fill="#ffffff" stroke="#d7e5f0"/>
    <rect x="568" y="160" width="225" height="9" rx="5" fill="#8766c5"/>
  </g>
  <circle cx="601" cy="207" r="19" fill="#8766c5"/><text x="601" y="213" text-anchor="middle" class="number">3</text>
  <g stroke="#8766c5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M720 187v18l-12 20a7 7 0 0 0 6 11h31a7 7 0 0 0 6-11l-12-20v-18"/><path d="M719 187h20M715 213h28M723 221h12"/>
  </g>
  <text x="586" y="264" class="stepTitle">Diagnostic</text><text x="586" y="288" class="stepTitle">Services*</text>
  <text x="586" y="326" class="body"><tspan x="586" dy="0">• Laboratory</tspan><tspan x="586" dy="23">• Radiology</tspan><tspan x="586" dy="23">• Results returned to care team</tspan></text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="831" y="160" width="225" height="266" rx="18" fill="#ffffff" stroke="#d7e5f0"/>
    <rect x="831" y="160" width="225" height="9" rx="5" fill="#e49b24"/>
  </g>
  <circle cx="864" cy="207" r="19" fill="#e49b24"/><text x="864" y="213" text-anchor="middle" class="number">4</text>
  <g stroke="#c48114" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="978" y="188" width="42" height="36" rx="5"/><path d="M999 195v22M988 206h22"/><path d="M972 228h54"/>
  </g>
  <text x="849" y="264" class="stepTitle">Pharmacy &amp;</text><text x="849" y="288" class="stepTitle">Billing</text>
  <text x="849" y="326" class="body"><tspan x="849" dy="0">• Prescription / dispensing</tspan><tspan x="849" dy="23">• Service charges</tspan><tspan x="849" dy="23">• Payment, as applicable</tspan></text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="1094" y="160" width="264" height="266" rx="18" fill="#ffffff" stroke="#d7e5f0"/>
    <rect x="1094" y="160" width="264" height="9" rx="5" fill="#2876b8"/>
  </g>
  <circle cx="1127" cy="207" r="19" fill="#2876b8"/><text x="1127" y="213" text-anchor="middle" class="number">5</text>
  <g stroke="#2876b8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1242 189h34l11 11v25h-45z"/><path d="M1276 189v13h11M1250 210h26M1250 219h18"/>
  </g>
  <text x="1112" y="264" class="stepTitle">Visit</text><text x="1112" y="288" class="stepTitle">Completion</text>
  <text x="1112" y="326" class="body"><tspan x="1112" dy="0">• Complete documentation</tspan><tspan x="1112" dy="23">• Patient instructions</tspan><tspan x="1112" dy="23">• Follow-up / next steps</tspan></text>

  <rect x="42" y="464" width="1316" height="78" rx="14" fill="#e5eef6"/>
  <text x="66" y="493" class="body" font-weight="700">* Diagnostic services are conditional</text>
  <text x="66" y="518" class="footer">Illustrative only. Actual sequence and modules depend on hospital policies, patient needs, and EMR/HIS configuration.</text>
</svg>
